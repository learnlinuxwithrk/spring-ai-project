<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Documents - DocuChat AI</title>
	<link rel="stylesheet" th:href="@{/css/style.css}">
   
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="logo-section">
                <div class="logo-icon">🤖</div>
                <div class="logo-text">
                    <h2>DoChat AI</h2>
                    <p>Admin Panel</p>
                </div>
            </div>

            <nav>
                <ul class="nav-menu">
                    <li class="nav-item">
                        <a href="/dashboard" class="nav-link">
                            <span class="nav-icon">📊</span>
                            Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="/upload" class="nav-link active">
                            <span class="nav-icon">📤</span>
                            Upload Documents
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="/chat" class="nav-link">
                            <span class="nav-icon">💬</span>
                            Chatbot
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="/reports" class="nav-link">
                            <span class="nav-icon">📈</span>
                            Reports
                        </a>
                    </li>
                
                    <li class="nav-item">
                        <a href="#" class="nav-link" id="logoutBtn">
                            <span class="nav-icon">🚪</span>
                            Logout
                        </a>
                    </li>
                </ul>
            </nav>

            <div class="user-section">
                <div class="user-avatar" id="userAvatar">JD</div>
                <div class="user-info">
                    <h4 id="userName">John Doe</h4>
                    <p id="userRole">Administrator</p>
                </div>
            </div>
        </aside>

        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <!-- Main Content -->
        <main class="main-content" id="mainContent">
            <header class="header">
                <div class="header-left">
                    <button class="menu-toggle" id="menuToggle">☰</button>
                    <div class="header-title">
                        <h1>Upload Documents 📤</h1>
                        <p>Add files to your document library</p>
                    </div>
                </div>
            </header>

            <div class="upload-container">
                <div class="upload-card">
                    <!-- Alerts -->
                    <div id="alertSuccess" class="alert alert-success">
                        <span>✅</span>
                        <span id="successMessage"></span>
                    </div>
                    <div id="alertError" class="alert alert-error">
                        <span>❌</span>
                        <span id="errorMessage"></span>
                    </div>

                    <form id="uploadForm" th:action="@{/doupload}" method="post" enctype="multipart/form-data">
                        <!-- Document Type -->
                        <div class="form-group">
                            <label for="documentType">
                                Document Type <span class="required">*</span>
                            </label>
                            <select id="documentType" name="type" required>
                                <option value="">Select document type</option>
                                <option value="pdf">PDF Document</option>
                                <option value="text">Text Document</option>
                                <option value="json">JSON Document</option>
                            </select>
                        </div>

                        <!-- File Upload -->
                        <div class="form-group">
                            <label for="fileInput">
                                Select File <span class="required">*</span>
                            </label>
                            <div class="file-upload-wrapper">
                                <input type="file" 
                                       id="fileInput" 
                                       name="file" 
                                       class="file-upload-input" 
                                       accept=".pdf,.txt,.json"
                                       required>
                                <label for="fileInput" id="fileLabel" class="file-upload-label">
                                    <div class="upload-icon">📁</div>
                                    <div class="upload-text">
                                        <p class="main-text">Drop your file here or click to browse</p>
                                        <p class="sub-text">Supports: PDF, TXT, JSON (Max 10MB)</p>
                                    </div>
                                </label>
                            </div>

                            <!-- File Info -->
                            <div id="fileInfo" class="file-info">
                                <div class="file-name" id="fileName"></div>
                                <div class="file-size" id="fileSize"></div>
                                <button type="button" class="remove-file" id="removeFile">Remove file</button>
                            </div>
                        </div>

                        <!-- Submit Button -->
                        <button type="submit" class="submit-btn" id="submitBtn">
                            <span id="btnText">Upload Document</span>
                            <div class="loader" id="loader"></div>
                        </button>
                    </form>
                </div>

                <!-- Recent Uploads 
                <div class="recent-uploads">
                    <h2 class="section-title">Recent Uploads</h2>
                    <div class="upload-list" id="uploadList">
                        <div class="upload-item">
                            <div class="file-icon pdf">📄</div>
                            <div class="file-details">
                                <h4>quarterly_report_Q4.pdf</h4>
                                <p class="file-meta">2.4 MB • Uploaded 2 mins ago</p>
                            </div>
                            <div class="file-actions">
                                <button class="btn-icon" title="Download">⬇️</button>
                                <button class="btn-icon" title="Delete">🗑️</button>
                            </div>
                        </div>
                        <div class="upload-item">
                            <div class="file-icon text">📝</div>
                            <div class="file-details">
                                <h4>meeting_notes.txt</h4>
                                <p class="file-meta">145 KB • Uploaded 1 hour ago</p>
                            </div>
                            <div class="file-actions">
                                <button class="btn-icon" title="Download">⬇️</button>
                                <button class="btn-icon" title="Delete">🗑️</button>
                            </div>
                        </div>
                        <div class="upload-item">
                            <div class="file-icon json">📊</div>
                            <div class="file-details">
                                <h4>data_export.json</h4>
                                <p class="file-meta">3.1 MB • Uploaded 3 hours ago</p>
                            </div>
                            <div class="file-actions">
                                <button class="btn-icon" title="Download">⬇️</button>
                                <button class="btn-icon" title="Delete">🗑️</button>
                            </div>
                        </div>
                    </div>
                </div>-->
            </div>
        </main>
    </div>

    <script th:inline="javascript">
        // Auth check
        if (!sessionStorage.getItem('token')) {
            window.location.href = '/login';
        }

        // Load user info
        const user = JSON.parse(sessionStorage.getItem('user') || '{}');
        if (user.name) {
            document.getElementById('userName').textContent = user.name;
            const initials = user.name.split(' ').map(n => n[0]).join('');
            document.getElementById('userAvatar').textContent = initials;
        }
        if (user.role) {
            document.getElementById('userRole').textContent = user.role;
        }

        // Mobile menu
        const menuToggle = document.getElementById('menuToggle');
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebarOverlay');

        menuToggle.addEventListener('click', () => {
            sidebar.classList.toggle('active');
            sidebarOverlay.classList.toggle('active');
        });

        sidebarOverlay.addEventListener('click', () => {
            sidebar.classList.remove('active');
            sidebarOverlay.classList.remove('active');
        });

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', (e) => {
            e.preventDefault();
            if (confirm('Are you sure you want to logout?')) {
                sessionStorage.clear();
                window.location.href = '/login';
            }
        });

        // File upload logic
        const fileInput = document.getElementById('fileInput');
        const fileLabel = document.getElementById('fileLabel');
        const fileInfo = document.getElementById('fileInfo');
        const fileName = document.getElementById('fileName');
        const fileSize = document.getElementById('fileSize');
        const removeFileBtn = document.getElementById('removeFile');
        const uploadForm = document.getElementById('uploadForm');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const loader = document.getElementById('loader');
        const alertSuccess = document.getElementById('alertSuccess');
        const alertError = document.getElementById('alertError');
        const successMessage = document.getElementById('successMessage');
        const errorMessage = document.getElementById('errorMessage');

        const MAX_FILE_SIZE = 10 * 1024 * 1024;

        fileInput.addEventListener('change', function(e) {
            handleFileSelect(e.target.files[0]);
        });

        fileLabel.addEventListener('dragover', function(e) {
            e.preventDefault();
            fileLabel.classList.add('dragover');
        });

        fileLabel.addEventListener('dragleave', function(e) {
            e.preventDefault();
            fileLabel.classList.remove('dragover');
        });

        fileLabel.addEventListener('drop', function(e) {
            e.preventDefault();
            fileLabel.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                fileInput.files = files;
                handleFileSelect(files[0]);
            }
        });

        function handleFileSelect(file) {
            if (!file) return;

            if (file.size > MAX_FILE_SIZE) {
                showAlert('error', 'File size exceeds 10MB limit');
                fileInput.value = '';
                return;
            }

            fileName.textContent = file.name;
            fileSize.textContent = formatFileSize(file.size);
            fileInfo.classList.add('show');
            hideAlerts();
        }

        removeFileBtn.addEventListener('click', function() {
            fileInput.value = '';
            fileInfo.classList.remove('show');
        });

        uploadForm.addEventListener('submit', function(e) {
            e.preventDefault();

            if (!fileInput.files[0]) {
                showAlert('error', 'Please select a file to upload');
                return;
            }

            const documentType = document.getElementById('documentType').value;
            if (!documentType) {
                showAlert('error', 'Please select a document type');
                return;
            }

            btnText.style.display = 'none';
            loader.classList.add('show');
            submitBtn.disabled = true;

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            formData.append('type', documentType);

            fetch(uploadForm.action, {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showAlert('success', 'Document uploaded successfully!');
                    uploadForm.reset();
                    fileInfo.classList.remove('show');
                    // Reload recent uploads
                    //loadRecentUploads();
                } else {
                    showAlert('error', data.message || 'Upload failed');
                }
            })
            .catch(error => {
                showAlert('error', 'An error occurred during upload');
                console.error('Upload error:', error);
            })
            .finally(() => {
                btnText.style.display = 'inline';
                loader.classList.remove('show');
                submitBtn.disabled = false;
            });
        });

        function showAlert(type, message) {
            hideAlerts();
            if (type === 'success') {
                successMessage.textContent = message;
                alertSuccess.classList.add('show');
                setTimeout(() => alertSuccess.classList.remove('show'), 5000);
            } else {
                errorMessage.textContent = message;
                alertError.classList.add('show');
                setTimeout(() => alertError.classList.remove('show'), 5000);
            }
        }

        function hideAlerts() {
            alertSuccess.classList.remove('show');
            alertError.classList.remove('show');
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }

        function loadRecentUploads() {
            fetch('/doUpload')
                .then(response => response.json())
                .then(data => {
                    // Update upload list if API returns data
                    console.log('Recent uploads loaded', data);
                })
                .catch(error => console.log('Using default uploads'));
        }
    </script>
</body>
</html>
