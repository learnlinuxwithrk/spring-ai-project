<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ministry-Chatbot</title>
<style>
    /* Reset & body */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #FAF9F6; display: flex; justify-content: center; align-items: center; height: 100vh; }

    /* Main container */
    .chat-container {
        width: 90%;
        max-width: 800px;
        height: 90vh;
        background: #fff;
        padding: 30px 25px 40px;
        border-radius: 15px;
        box-shadow: 0 20px 50px rgba(0,0,0,0.15);
        display: flex;
        flex-direction: column;
        gap: 20px;
    }

    /* Header text */
    .chat-container h1 {
        font-weight: 600;
        font-size: 2rem;
        color: #333;
        text-align: center;
    }

    /* Chat area */
    .chat-area {
        flex: 1;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding-right: 5px;
    }

    .chat-bubble {
        padding: 12px 18px;
        border-radius: 20px;
        max-width: 75%;
        word-wrap: break-word;
        font-size: 1rem;
    }

    .chat-bubble.user {
        background: #DCF8C6;
        align-self: flex-end;
        border-bottom-right-radius: 0;
    }

    .chat-bubble.bot {
        background: #F1F0F0;
        align-self: flex-start;
        border-bottom-left-radius: 0;
    }

    /* Chat input */
    .chat-input {
        display: flex;
        gap: 10px;
    }

    .chat-input input {
        flex: 1;
        padding: 15px 20px;
        border-radius: 25px;
        border: 1px solid #ccc;
        font-size: 1.1rem;
        outline: none;
    }

    .chat-input button {
        padding: 15px 20px;
        border: none;
        border-radius: 25px;
        background: #F29279;
        color: #fff;
        font-weight: bold;
        font-size: 1.1rem;
        cursor: pointer;
        transition: 0.2s;
        box-shadow: 0 5px 15px rgba(242, 146, 121, 0.5);
    }

    .chat-input button:hover {
        background: #e06a4f;
        box-shadow: 0 5px 15px rgba(224, 106, 79, 0.5);
    }
</style>
</head>
<body>

<div class="chat-container">
    <h1>How can I help you today?</h1>

    <div class="chat-area" id="chatArea"></div>

    <div class="chat-input">
        <input type="text" id="chatInput" placeholder="Type a message..." onkeypress="if(event.key==='Enter'){sendMessage();}">
        <button onclick="sendMessage()">➤</button>
    </div>
</div>

<script>
    const chatArea = document.getElementById('chatArea');
    let eventSource = null;

    function appendMessage(text, sender) {
        const div = document.createElement('div');
        div.className = `chat-bubble ${sender}`;
        div.textContent = text;
        chatArea.appendChild(div);
        chatArea.scrollTop = chatArea.scrollHeight;
    }

    function sendMessage() {
        const input = document.getElementById('chatInput');
        const text = input.value.trim();
        if(!text) return;
        appendMessage(text, 'user');
        input.value = '';

        if(eventSource) eventSource.close();

        const encoded = encodeURIComponent(text);
        const url = `/chatme?q=${encoded}`;
        eventSource = new EventSource(url);

        let botText = '';
        const botDiv = document.createElement('div');
        botDiv.className = 'chat-bubble bot';
        chatArea.appendChild(botDiv);

        eventSource.onmessage = function(event) {
            botText += event.data + ' ';
            botDiv.textContent = botText;
            chatArea.scrollTop = chatArea.scrollHeight;
        };

        eventSource.onerror = function() {
            eventSource.close();
        };
    }
</script>

</body>
</html>
