spring.application.name=first-project
server.port=8080
server.address=0.0.0.0
#spring.ai.chat.client.enabled=false
#api key for open ai
#spring.ai.openai.api-key=${OPENAI_API_KEY}
#custom model we are using
#spring.ai.openai.chat.options.model=gpt-4.1
#spring.ai.openai.chat.options.temperature=0.2
#spring.ai.openai.chat.options.max_tokens=1000
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=llama3.2
spring.ai.ollama.chat.options.temperature=0.2
spring.ai.ollama.chat.options.max-tokens=1000
spring.ai.ollama.embedding.model=nomic-embed-text:latest
#
logging.level.org.springframework.ai.chat.client.advisor=DEBUG

#db configurations
spring.datasource.url=jdbc:mariadb://localhost:3308/ollama_chatbot
spring.datasource.username=root
spring.datasource.password=root1234
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

spring.ai.chat.memory.repository.jdbc.initialize-schema=ALWAYS

spring.ai.vectorstore.mariadb.initialize-schema=true
spring.ai.vectorstore.mariadb.distance-type=COSINE
spring.ai.vectorstore.mariadb.dimensions=768

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

