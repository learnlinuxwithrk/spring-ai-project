<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Professional Chatbot</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.2/css/bootstrap.min.css}">
    <script th:src="@{/webjars/jquery/3.7.1/jquery.min.js}"></script>
    <script th:src="@{/webjars/bootstrap/5.3.2/js/bootstrap.bundle.min.js}"></script>

    <style>
        body { background: #f5f5f5; }
        .chat-container { max-width: 600px; margin: 50px auto; background: white; border-radius: 12px;
                          box-shadow: 0 0 15px rgba(0,0,0,0.1); display: flex; flex-direction: column;
                          height: 80vh; overflow: hidden; }
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; }
        .message { margin-bottom: 15px; display: flex; align-items: flex-start; }
        .message.user .bubble { background: #007bff; color: white; margin-left: auto; }
        .message.bot .bubble { background: #e9ecef; color: #333; margin-right: auto; }
        .bubble { padding: 10px 15px; border-radius: 15px; max-width: 70%; word-wrap: break-word; }
        .chat-input { display: flex; padding: 10px; border-top: 1px solid #ddd; }
        .chat-input input { flex: 1; padding: 10px 15px; border-radius: 25px; border: 1px solid #ddd; }
        .chat-input button { margin-left: 10px; border-radius: 25px; }
    </style>
</head>
<body>
<div class="chat-container">
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-input">
        <input type="text" id="userInput" placeholder="Type a message..." />
        <button class="btn btn-primary" id="sendBtn">Send</button>
    </div>
</div>

<script>
function addMessage(content, sender) {
    let bubbleClass = sender === 'user' ? 'user' : 'bot';
    $('#chatMessages').append(
        `<div class="message ${bubbleClass}"><div class="bubble">${content}</div></div>`
    );
    $('#chatMessages').scrollTop($('#chatMessages')[0].scrollHeight);
}

function streamMessage(url) {
    let botBubble = $('<div class="message bot"><div class="bubble"></div></div>');
    $('#chatMessages').append(botBubble);

    const eventSource = new EventSource(url);

    eventSource.onmessage = function(event) {
        botBubble.find('.bubble').append(event.data + " "); // stream word by word
        $('#chatMessages').scrollTop($('#chatMessages')[0].scrollHeight);
    };

    eventSource.onerror = function() {
        eventSource.close();
        botBubble.find('.bubble').append(" [Error receiving response]");
    };
}

function sendMessage() {
    let message = $('#userInput').val().trim();
    if (!message) return;

    addMessage(message, 'user');
    $('#userInput').val('');

    streamMessage('/answerme?q=' + encodeURIComponent(message));
}

$('#sendBtn').click(sendMessage);
$('#userInput').keypress(function(e) {
    if (e.which === 13) sendMessage();
});
</script>
</body>
</html>
